services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dance_studio}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dance_studio_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/db_DanceStudio.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/migrations/20261116_chatbot_faq.sql:/docker-entrypoint-initdb.d/002-chatbot-faq.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dance_studio}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-dance_studio_local}
      PORT: 3000
      FRONTEND_URL: https://localhost
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./frontend/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
